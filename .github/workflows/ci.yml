name: CI

on:
  pull_request:
  push:
    branches: [main, feat/restaurant-hardening-and-front-of-house]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # `npm ci` triggers the postinstall `prisma generate`, which needs no
      # database connection — only the schema.
      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # The environment is validated while the build collects page data, so it
      # needs well-formed values. None of these is a real secret and nothing
      # connects to the database: every page is rendered per request.
      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          AUTH_SECRET: ci-only-placeholder-not-a-real-secret-0000
          CRON_SECRET: ci-only-placeholder-0000
          NEXT_PUBLIC_BASE_URL: http://localhost:3000
