version: '3.8'

services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: masadan
      POSTGRES_PASSWORD: choose-a-password
      POSTGRES_DB: masadan
    ports:
      # Loopback only: the database is never reached from another machine.
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
